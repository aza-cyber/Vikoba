name: vikoba
description: "VICOBA - Village Community Bank management app (bilingual SW/EN prototype)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  # On-device SQLite database (durable row store; balances derived from rows).
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4
  # HTTP client for the online (PostgreSQL backend) mode.
  http: ^1.2.2
  # PDF generation and cross-platform save/share/print support for reports.
  pdf: ^3.11.1
  printing: ^5.13.4
  # Native .xlsx (Excel) workbook generation for reports and bulk-member import.
  excel: ^4.0.6
  # File picker for the admin's bulk-member Excel upload.
  file_picker: ^8.1.2
  # Cross-platform share sheet for non-PDF files (the Excel export).
  share_plus: ^10.1.2
  # Push notifications (Firebase Cloud Messaging). Initialisation is guarded, so
  # the app still runs if Firebase isn't configured yet — see PushService and
  # docs/PUSH_SETUP.md for the one-time Firebase project setup that activates it.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Kept for migrating any data written by the previous shared_preferences build.
  shared_preferences: ^2.3.2
  # Loose constraint: flutter_localizations pins the exact intl version for the
  # installed SDK, so let pub resolve a compatible one rather than fighting it.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/vikoba_logo.png
