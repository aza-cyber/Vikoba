name: vikoba_api
description: HTTP API that bridges the VICOBA Flutter app and PostgreSQL.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.4.0

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  postgres: ^3.4.0
  bcrypt: ^1.1.3
  # Outbound HTTP for the Africa's Talking SMS gateway (OTP delivery) and the
  # Firebase Cloud Messaging HTTP v1 API (push notifications).
  http: ^1.2.2
  # Service-account OAuth2 (JWT) to authenticate FCM HTTP v1 send requests.
  googleapis_auth: ^1.6.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
